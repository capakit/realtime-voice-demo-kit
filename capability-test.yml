tests:
  - id: checks-voice-stack-chat-asr-readiness-and-tts-output
    kind: http
    target:
      workload: voice-session
      endpoint: /test
    request:
      method: POST
      path: /checks-voice-stack-chat-asr-readiness-and-tts-output
    verbose_output:
      - $.body.asr_model_count
      - $.body.reply
      - $.body.speech_bytes
    validations:
      - $.status_code.eq(200)
      - $.body.asr_model_count.gte(1)
      - $.body.reply.exists()
      - $.body.speech_bytes.gte(100)
  - id: voice-session-workload-typechecks
    kind: exec
    target:
      workload: voice-session
    request:
      command:
        - bun
        - x
        - tsc
        - --noEmit
    validations:
      - $.exit_code.eq(0)
